<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID 转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        .section {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        #input {
            height: 150px;
        }
        #output {
            height: 100px;
            background: #f8f9ff;
            word-break: break-all;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .convert-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .convert-btn:active {
            transform: translateY(0);
        }
        .copy-btn {
            background: #f0f0f0;
            color: #333;
        }
        .copy-btn:hover {
            background: #e0e0e0;
        }
        .copy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .clear-btn {
            background: #ffebee;
            color: #c62828;
        }
        .clear-btn:hover {
            background: #ffcdd2;
        }
        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 4px;
            color: #1565c0;
            font-size: 12px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .success-msg {
            color: #2e7d32;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        .stats {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            display: none;
        }
        .stats.show {
            display: block;
        }
        .dedup-btn {
            background: #fff3cd;
            color: #856404;
        }
        .dedup-btn:hover {
            background: #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 ID 转换工具</h1>

        <div class="info">
            <strong>使用说明：</strong>在左侧粘贴竖排的 ID（每行一个），点击"转换"即可生成逗号分隔的结果。支持清理空行和空格。
        </div>

        <div class="section">
            <label for="input">输入 ID（竖排格式）：</label>
            <textarea id="input" placeholder="请粘贴竖排的 ID，每行一个&#10;例如：&#10;123&#10;456&#10;789"></textarea>
        </div>

        <div class="section">
            <label for="output">输出结果：</label>
            <textarea id="output" readonly placeholder="转换结果将显示在这里"></textarea>
            <div class="success-msg" id="successMsg">✓ 已复制到剪贴板</div>
            <div class="stats" id="stats"></div>
        </div>

        <div class="section">
            <label for="prefixOutput">取前 N 位（去重）：</label>
            <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center;">
                <label style="margin: 0; font-size: 12px; color: #666;">位数：</label>
                <input type="number" id="prefixLength" value="6" min="1" max="50" style="width: 70px; padding: 6px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 13px;">
                <span style="font-size: 12px; color: #999;">（默认取前 6 位）</span>
            </div>
            <textarea id="prefixOutput" readonly placeholder="取前 N 位并去重后的结果将显示在这里"></textarea>
        </div>

        <div class="section">
            <label for="sqlOutput">SQL 格式：</label>
            <textarea id="sqlOutput" readonly placeholder="SQL 格式的结果将显示在这里"></textarea>
        </div>

        <div class="button-group">
            <button class="convert-btn" onclick="convertIds()">转 换</button>
            <button class="dedup-btn" id="dedupBtn" onclick="dedupIds()" disabled>去 重</button>
        </div>

        <div class="button-group" style="margin-top: 10px;">
            <button class="convert-btn" style="background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);" onclick="reverseConvert()">⬅️ 反向转换</button>
            <button class="convert-btn" style="background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);" id="sqlBtn" onclick="generateSQL()" disabled>生成 SQL</button>
            <button class="convert-btn" style="background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);" id="prefixBtn" onclick="extractPrefix()" disabled>取前 N 位 + 去重</button>
        </div>

        <div class="button-group" style="margin-top: 10px;">
            <button class="copy-btn" id="reverseCopyBtn" onclick="copyReverse()" disabled>复制反向</button>
            <button class="copy-btn" id="copyBtn" onclick="copyOutput()" disabled>复制逗号</button>
            <button class="copy-btn" id="sqlCopyBtn" onclick="copySql()" disabled>复制 SQL</button>
            <button class="copy-btn" id="prefixCopyBtn" onclick="copyPrefix()" disabled>复制前 N 位</button>
        </div>

        <div class="button-group" style="margin-top: 15px;">
            <button class="clear-btn" onclick="clearAll()">清 空</button>
        </div>

        <div style="border-top: 2px dashed #e0e0e0; margin: 30px 0 20px; padding-top: 20px;">
            <h2 style="color: #333; font-size: 20px; margin-bottom: 20px; text-align: center;">📅 日期格式转换</h2>

            <div class="section">
                <label for="dateInput">输入日期（M/D/YYYY 格式）：</label>
                <textarea id="dateInput" placeholder="请输入日期，例如：&#10;8/5/2026&#10;或多个日期，每行一个" style="height: 80px;"></textarea>
            </div>

            <div class="section">
                <label for="dateOutput">输出结果（YYYY-M-D 格式）：</label>
                <textarea id="dateOutput" readonly placeholder="转换结果将显示在这里" style="height: 80px;"></textarea>
            </div>

            <div class="button-group">
                <button class="convert-btn" style="background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);" onclick="convertDate()">转 换</button>
                <button class="copy-btn" id="dateCopyBtn" onclick="copyDate()" disabled>复 制</button>
                <button class="clear-btn" onclick="clearDate()">清 空</button>
            </div>
        </div>
    </div>

    <script>
        let currentIds = []; // 存储当前的ID列表

        function convertIds() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');
            const dedupBtn = document.getElementById('dedupBtn');
            const sqlBtn = document.getElementById('sqlBtn');
            const prefixBtn = document.getElementById('prefixBtn');
            const stats = document.getElementById('stats');

            // 分割并清理
            currentIds = input
                .split('\n')
                .map(id => id.trim())
                .filter(id => id !== '');

            if (currentIds.length === 0) {
                output.value = '';
                copyBtn.disabled = true;
                dedupBtn.disabled = true;
                sqlBtn.disabled = true;
                prefixBtn.disabled = true;
                stats.classList.remove('show');
                return;
            }

            // 转换为逗号分隔
            const result = currentIds.join(',');
            output.value = result;
            copyBtn.disabled = false;
            dedupBtn.disabled = false;
            sqlBtn.disabled = false;
            prefixBtn.disabled = false;

            // 显示统计信息
            showStats(currentIds.length, new Set(currentIds).size);
        }

        function dedupIds() {
            if (currentIds.length === 0) return;

            // 去重
            const uniqueIds = [...new Set(currentIds)];
            const duplicateCount = currentIds.length - uniqueIds.length;

            // 更新输出
            const output = document.getElementById('output');
            output.value = uniqueIds.join(',');
            currentIds = uniqueIds;

            // 清空 SQL 输出
            document.getElementById('sqlOutput').value = '';
            document.getElementById('sqlBtn').disabled = false;
            document.getElementById('sqlCopyBtn').disabled = true;

            // 更新统计信息
            showStats(uniqueIds.length, uniqueIds.length, duplicateCount);
        }

        function generateSQL() {
            if (currentIds.length === 0) return;

            // 生成 SQL 格式：'1','2','3'
            const sqlFormat = currentIds.map(id => `'${id}'`).join(',');
            document.getElementById('sqlOutput').value = sqlFormat;
            document.getElementById('sqlCopyBtn').disabled = false;
        }

        function extractPrefix() {
            if (currentIds.length === 0) return;

            // 获取截取位数
            const prefixLength = parseInt(document.getElementById('prefixLength').value) || 6;

            // 截取前 N 位并去重
            const prefixes = currentIds.map(id => id.substring(0, prefixLength));
            const uniquePrefixes = [...new Set(prefixes)];

            // 输出为逗号分隔格式
            document.getElementById('prefixOutput').value = uniquePrefixes.join(',');
            document.getElementById('prefixCopyBtn').disabled = false;
        }

        function showStats(total, unique, removed = 0) {
            const stats = document.getElementById('stats');
            if (removed > 0) {
                stats.innerHTML = `📊 总计: ${total} 个 ID | 去重后: ${unique} 个 | 移除: ${removed} 个重复`;
            } else {
                const dupCount = total - unique;
                if (dupCount > 0) {
                    stats.innerHTML = `📊 总计: ${total} 个 ID | 唯一: ${unique} 个 | 重复: ${dupCount} 个`;
                } else {
                    stats.innerHTML = `📊 总计: ${total} 个 ID | 无重复`;
                }
            }
            stats.classList.add('show');
        }

        function reverseConvert() {
            const output = document.getElementById('output');
            if (!output.value) return;

            // 分割逗号、空格、换行等分隔符
            const ids = output.value
                .split(/[,\s]+/)
                .map(id => id.trim())
                .filter(id => id !== '');

            if (ids.length === 0) {
                document.getElementById('input').value = '';
                document.getElementById('reverseCopyBtn').disabled = true;
                return;
            }

            // 转换为竖排格式
            const result = ids.join('\n');
            document.getElementById('input').value = result;
            document.getElementById('reverseCopyBtn').disabled = false;
        }

        function reverseFromInput() {
            const input = document.getElementById('input');
            const output = document.getElementById('output');

            if (!output.value) {
                alert('请先在右侧输入逗号分隔的 ID');
                return;
            }

            reverseConvert();
        }

        function copyOutput() {
            const output = document.getElementById('output');
            if (!output.value) return;

            // 方法1：使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(output.value)
                    .then(() => {
                        showCopySuccess();
                    })
                    .catch(() => {
                        fallbackCopy(output.value);
                    });
            } else {
                // 方法2：备用方案（老浏览器）
                fallbackCopy(output.value);
            }
        }

        function copySql() {
            const sqlOutput = document.getElementById('sqlOutput');
            if (!sqlOutput.value) return;

            // 方法1：使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(sqlOutput.value)
                    .then(() => {
                        showCopySuccess();
                    })
                    .catch(() => {
                        fallbackCopy(sqlOutput.value);
                    });
            } else {
                // 方法2：备用方案（老浏览器）
                fallbackCopy(sqlOutput.value);
            }
        }

        function copyPrefix() {
            const prefixOutput = document.getElementById('prefixOutput');
            if (!prefixOutput.value) return;

            // 方法1：使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(prefixOutput.value)
                    .then(() => {
                        showCopySuccess();
                    })
                    .catch(() => {
                        fallbackCopy(prefixOutput.value);
                    });
            } else {
                // 方法2：备用方案（老浏览器）
                fallbackCopy(prefixOutput.value);
            }
        }

        function copyReverse() {
            const input = document.getElementById('input');
            if (!input.value) return;

            // 方法1：使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(input.value)
                    .then(() => {
                        showCopySuccess();
                    })
                    .catch(() => {
                        fallbackCopy(input.value);
                    });
            } else {
                // 方法2：备用方案（老浏览器）
                fallbackCopy(input.value);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopySuccess();
            } catch (err) {
                alert('复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        function showCopySuccess() {
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2000);
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('sqlOutput').value = '';
            document.getElementById('prefixOutput').value = '';
            document.getElementById('copyBtn').disabled = true;
            document.getElementById('dedupBtn').disabled = true;
            document.getElementById('sqlBtn').disabled = true;
            document.getElementById('sqlCopyBtn').disabled = true;
            document.getElementById('prefixBtn').disabled = true;
            document.getElementById('prefixCopyBtn').disabled = true;
            document.getElementById('reverseCopyBtn').disabled = true;
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('stats').classList.remove('show');
            currentIds = [];
        }

        function clearReverse() {
            document.getElementById('input').value = '';
            document.getElementById('reverseCopyBtn').disabled = true;
            document.getElementById('successMsg').style.display = 'none';
        }

        // 日期格式转换：8/5/2026 → 2026-8-5
        function convertDate() {
            const input = document.getElementById('dateInput').value;
            const output = document.getElementById('dateOutput');
            const copyBtn = document.getElementById('dateCopyBtn');

            const lines = input
                .split('\n')
                .map(line => line.trim())
                .filter(line => line !== '');

            if (lines.length === 0) {
                output.value = '';
                copyBtn.disabled = true;
                return;
            }

            const results = lines.map(line => {
                // 匹配 M/D/YYYY 格式
                const parts = line.split('/');
                if (parts.length === 3) {
                    const month = parts[0].trim();
                    const day = parts[1].trim();
                    const year = parts[2].trim();
                    return `${year}-${month}-${day}`;
                }
                return line; // 格式不匹配则原样返回
            });

            output.value = results.join('\n');
            copyBtn.disabled = false;
        }

        function copyDate() {
            const dateOutput = document.getElementById('dateOutput');
            if (!dateOutput.value) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(dateOutput.value)
                    .then(() => showCopySuccess())
                    .catch(() => fallbackCopy(dateOutput.value));
            } else {
                fallbackCopy(dateOutput.value);
            }
        }

        function clearDate() {
            document.getElementById('dateInput').value = '';
            document.getElementById('dateOutput').value = '';
            document.getElementById('dateCopyBtn').disabled = true;
        }

        // 回车快速转换
        document.getElementById('input').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                convertIds();
            }
        });

        document.getElementById('output').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                reverseConvert();
            }
        });
    </script>
</body>
</html>
